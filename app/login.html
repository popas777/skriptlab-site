<!DOCTYPE html>
<html lang="fi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkriptLab - Kirjaudu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=60">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        .login-box {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        .login-box .logo {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            font-size: 15px;
        }
        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(121, 192, 255, 0.2);
        }
        .credential-field {
            position: relative;
        }
        .credential-field input {
            padding-right: 52px;
        }
        .password-visibility-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            display: inline-flex;
            width: 36px;
            height: 36px;
            padding: 0;
            align-items: center;
            justify-content: center;
            transform: translateY(-50%);
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .password-visibility-toggle:hover {
            background: rgba(121, 192, 255, 0.12);
            color: var(--text-primary);
        }
        .password-visibility-toggle:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 1px;
        }
        .password-visibility-toggle svg {
            width: 20px;
            height: 20px;
        }
        .password-visibility-toggle svg[hidden] {
            display: none;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 16px;
        }
        .login-mode-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 5px;
            margin-bottom: 22px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(0,0,0,0.16);
        }
        .login-mode-btn {
            padding: 9px 12px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--text-secondary);
            font: 600 13px 'Inter', sans-serif;
            cursor: pointer;
        }
        .login-mode-btn.active {
            background: rgba(121, 192, 255, 0.16);
            color: var(--text-primary);
            box-shadow: inset 0 0 0 1px rgba(121, 192, 255, 0.28);
        }
        .login-divider {
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
            position: relative;
        }
        .login-divider::before, .login-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--border-color);
        }
        .login-divider::before { left: 0; }
        .login-divider::after { right: 0; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box glass-panel">
            <h1 class="logo">SkriptLab<span class="accent">.</span></h1>
            <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 15px;">Kirjailijan moderni työkalupakki</p>

            <div class="login-mode-switch" role="group" aria-label="Kirjautumistapa">
                <button type="button" class="login-mode-btn active" data-login-mode="password" aria-pressed="true">Salasana</button>
                <button type="button" class="login-mode-btn" data-login-mode="invite" aria-pressed="false">Kutsukoodi</button>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <label>Sähköposti</label>
                    <input type="text" inputmode="email" id="email" placeholder="nimi@example.com" required>
                </div>
                <div class="input-group">
                    <label id="credential-label" for="credential">Salasana</label>
                    <div class="credential-field">
                        <input type="password" id="credential" autocomplete="current-password" placeholder="Kirjoita salasana" required>
                        <button
                            type="button"
                            class="password-visibility-toggle"
                            id="password-visibility-toggle"
                            aria-label="Näytä salasana"
                            aria-controls="credential"
                            aria-pressed="false"
                            title="Näytä salasana"
                        >
                            <svg id="password-visible-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                <circle cx="12" cy="12" r="2.75"></circle>
                            </svg>
                            <svg id="password-hidden-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 6.15A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a17.3 17.3 0 0 1-2.1 2.8"></path>
                                <path d="M6.2 6.25C3.8 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1.25 0 2.4-.26 3.45-.68"></path>
                                <path d="M10.1 10.15a2.75 2.75 0 0 0 3.75 3.75"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary login-btn" id="login-submit">Kirjaudu sisään</button>
            </form>
            <p id="login-status" style="color: var(--text-secondary); min-height: 20px; font-size: 13px;"></p>
        </div>
    </div>
    
    <script src="config.js?v=1"></script>
    <script>
        const API_BASE_URL = (window.SKRIPTLAB_CONFIG && window.SKRIPTLAB_CONFIG.API_BASE_URL) || "http://127.0.0.1:8000";
        const apiUrl = (path) => `${API_BASE_URL}${path}`;
    </script>
    <script src="auth.js?v=3"></script>
    <script>
        const existingUser = window.SkriptLabAuth.getUser();
        if (window.SkriptLabAuth.getToken() && existingUser) {
            window.location.replace(existingUser.role === 'admin' ? 'admin.html' : 'index.html');
        }

        let loginMode = 'password';
        const credentialInput = document.getElementById('credential');
        const credentialLabel = document.getElementById('credential-label');
        const passwordVisibilityToggle = document.getElementById('password-visibility-toggle');
        const passwordVisibleIcon = document.getElementById('password-visible-icon');
        const passwordHiddenIcon = document.getElementById('password-hidden-icon');

        function setPasswordVisible(visible) {
            credentialInput.type = visible ? 'text' : 'password';
            passwordVisibilityToggle.setAttribute('aria-pressed', String(visible));
            passwordVisibilityToggle.setAttribute('aria-label', visible ? 'Piilota salasana' : 'Näytä salasana');
            passwordVisibilityToggle.title = visible ? 'Piilota salasana' : 'Näytä salasana';
            passwordVisibleIcon.toggleAttribute('hidden', visible);
            passwordHiddenIcon.toggleAttribute('hidden', !visible);
        }

        passwordVisibilityToggle.addEventListener('click', () => {
            setPasswordVisible(credentialInput.type === 'password');
            credentialInput.focus();
        });

        document.querySelectorAll('[data-login-mode]').forEach((button) => {
            button.addEventListener('click', () => {
                loginMode = button.dataset.loginMode;
                document.querySelectorAll('[data-login-mode]').forEach((item) => {
                    const active = item === button;
                    item.classList.toggle('active', active);
                    item.setAttribute('aria-pressed', String(active));
                });
                const inviteMode = loginMode === 'invite';
                setPasswordVisible(false);
                passwordVisibilityToggle.hidden = inviteMode;
                credentialLabel.textContent = inviteMode ? 'Kutsukoodi' : 'Salasana';
                credentialInput.placeholder = inviteMode ? 'Kirjoita saamasi kutsukoodi' : 'Kirjoita salasana';
                credentialInput.autocomplete = inviteMode ? 'one-time-code' : 'current-password';
                document.getElementById('login-status').textContent = '';
                credentialInput.focus();
            });
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('login-status');
            const submit = document.getElementById('login-submit');
            const email = document.getElementById('email').value.trim().toLowerCase();
            const credential = credentialInput.value.trim();

            status.textContent = 'Kirjaudutaan sisään...';
            submit.disabled = true;

            try {
                const passwordMode = loginMode === 'password';
                const res = await fetch(apiUrl(passwordMode ? '/api/auth/login' : '/api/auth/accept-invite'), {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(passwordMode
                        ? {email, password: credential}
                        : {email, invite_code: credential})
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(passwordMode
                        ? 'Sähköposti tai salasana ei kelpaa.'
                        : 'Sähköposti tai kutsukoodi ei kelpaa.');
                }

                window.SkriptLabAuth.setSession(data.access_token, data.user);
                window.location.replace(data.user.role === 'admin' ? 'admin.html' : 'index.html');
            } catch (err) {
                status.textContent = err.message;
                submit.disabled = false;
            }
        });
    </script>
</body>
</html>
